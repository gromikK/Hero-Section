<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Creative Solutions</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
        crossorigin="anonymous">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fff8f0;
        }

        .hero-saas {
            background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%);
            color: #fff;
            border-radius: 2rem;
            padding: 3.5rem 2rem;
        }

        .feature-badge {
            background-color: rgba(255, 255, 255, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 2rem;
            padding: 0.5rem 0.8rem;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
            display: inline-block;
        }

        .illustration-placeholder {
            background-color: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 1.5rem;
            min-height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
        }

        .hero-saas .btn-light {
            color: #e76f51;
            transition: 0.3s;
        }

        .hero-saas .btn-light:hover {
            background-color: #fff0e5;
            transform: translateY(-2px);
        }

        @media (max-width: 576px) {
            .hero-saas {
                padding: 2rem 1rem;
                border-radius: 1rem;
            }

            .illustration-placeholder {
                min-height: 220px;
            }
        }
    </style>
</head>

<body>

    <div class="container-fluid container-sm mt-5 mb-5">

        <h1 class="text-center mb-5 text-dark">
            Creative Solutions
        </h1>

        <section class="hero-saas shadow-lg">

            <div class="container">
                <div class="row align-items-center g-4">

                    <div class="col-12 col-lg-7 text-center text-lg-start">

                        <h2 class="display-4 fw-bold mb-3">
                            Build Something Amazing!
                        </h2>

                        <p class="lead mb-4">
                            Turn your creative ideas into successful projects
                            with simple tools, flexible solutions, and
                            everything you need to get started.
                        </p>

                        <div class="container mb-4 px-0">
                            <div class="row g-2">

                                <div class="col-6 col-md-4">
                                    <div class="feature-badge w-100 text-center">
                                        Easy Setup
                                    </div>
                                </div>

                                <div class="col-6 col-md-4">
                                    <div class="feature-badge w-100 text-center">
                                        Smart Tools
                                    </div>
                                </div>

                                <div class="col-6 col-md-4">
                                    <div class="feature-badge w-100 text-center">
                                        24/7 Help
                                    </div>
                                </div>

                            </div>
                        </div>

                        <a href="#start"
                           class="btn btn-light btn-lg rounded-pill px-4 shadow">
                            Explore Now
                        </a>

                    </div>

                    <div class="col-12 col-lg-5">

                        <div class="illustration-placeholder text-center">
                            <div>
                                <div style="font-size: 75px;">💡</div>
                                <h3 class="mt-3">Think Beyond</h3>
                                <p class="mb-0">
                                    Creativity starts here!
                                </p>
                            </div>
                        </div>

                    </div>

                </div>
            </div>

        </section>

    </div>

</body>
</html>
